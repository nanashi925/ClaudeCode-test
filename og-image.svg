<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#0f1019"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d98f40;stop-opacity:0.08"/>
      <stop offset="50%" style="stop-color:#0a0a0f;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#5b8def;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e8e6e3"/>
      <stop offset="50%" style="stop-color:#d98f40"/>
      <stop offset="100%" style="stop-color:#5b8def"/>
    </linearGradient>
    <linearGradient id="termBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e2130"/>
      <stop offset="100%" style="stop-color:#161825"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="630"/><line x1="40" y1="0" x2="40" y2="630"/>
    <line x1="80" y1="0" x2="80" y2="630"/><line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="160" y1="0" x2="160" y2="630"/><line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="280" y1="0" x2="280" y2="630"/>
    <line x1="320" y1="0" x2="320" y2="630"/><line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/><line x1="440" y1="0" x2="440" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="520" y1="0" x2="520" y2="630"/>
    <line x1="560" y1="0" x2="560" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="640" y1="0" x2="640" y2="630"/><line x1="680" y1="0" x2="680" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="760" y1="0" x2="760" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/><line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="880" y1="0" x2="880" y2="630"/><line x1="920" y1="0" x2="920" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/><line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1040" y1="0" x2="1040" y2="630"/><line x1="1080" y1="0" x2="1080" y2="630"/>
    <line x1="1120" y1="0" x2="1120" y2="630"/><line x1="1160" y1="0" x2="1160" y2="630"/>
    <line x1="0" y1="40" x2="1200" y2="40"/><line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="280" x2="1200" y2="280"/><line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="440" x2="1200" y2="440"/><line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="520" x2="1200" y2="520"/><line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <!-- Left content area -->
  <!-- Logo icon -->
  <rect x="80" y="160" width="52" height="52" rx="12" fill="#d98f40"/>
  <text x="106" y="194" text-anchor="middle" font-family="'SF Mono','Fira Code',monospace" font-weight="700" font-size="22" fill="#0a0a0f">&gt;_</text>

  <!-- Badge -->
  <rect x="80" y="240" width="260" height="30" rx="15" fill="#d98f40" fill-opacity="0.15" stroke="#d98f40" stroke-opacity="0.3" stroke-width="1"/>
  <circle cx="98" cy="255" r="4" fill="#d98f40"/>
  <text x="112" y="260" font-family="'SF Mono','Fira Code',monospace" font-size="12" fill="#d98f40">Interactive Capabilities Guide</text>

  <!-- Title -->
  <text x="80" y="320" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif" font-weight="700" font-size="48" fill="url(#titleGrad)">Claude Code</text>
  <text x="80" y="370" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif" font-weight="700" font-size="42" fill="#e8e6e3" fill-opacity="0.85">ガイド</text>

  <!-- Subtitle -->
  <text x="80" y="415" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif" font-weight="400" font-size="17" fill="#9a96a6">ターミナルで動くAIペアプログラマーの全力を引き出す</text>

  <!-- Tags -->
  <rect x="80" y="450" width="64" height="26" rx="13" fill="#d98f40" fill-opacity="0.15"/>
  <text x="112" y="468" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" fill="#d98f40">Code</text>

  <rect x="154" y="450" width="52" height="26" rx="13" fill="#5b8def" fill-opacity="0.12"/>
  <text x="180" y="468" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" fill="#5b8def">Git</text>

  <rect x="216" y="450" width="72" height="26" rx="13" fill="#4ec9a0" fill-opacity="0.12"/>
  <text x="252" y="468" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" fill="#4ec9a0">Search</text>

  <rect x="298" y="450" width="68" height="26" rx="13" fill="#b48ead" fill-opacity="0.12"/>
  <text x="332" y="468" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" fill="#b48ead">Agent</text>

  <rect x="376" y="450" width="56" height="26" rx="13" fill="#56b6c2" fill-opacity="0.12"/>
  <text x="404" y="468" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" fill="#56b6c2">MCP</text>

  <!-- Right side: Terminal mockup -->
  <g filter="url(#shadow)">
    <rect x="620" y="130" width="500" height="370" rx="16" fill="#1a1d2e" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Terminal title bar -->
    <rect x="620" y="130" width="500" height="44" rx="16" fill="url(#termBar)"/>
    <rect x="620" y="158" width="500" height="16" fill="url(#termBar)"/>
    <line x1="620" y1="174" x2="1120" y2="174" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <circle cx="648" cy="152" r="6" fill="#e06c75"/>
    <circle cx="668" cy="152" r="6" fill="#d98f40"/>
    <circle cx="688" cy="152" r="6" fill="#4ec9a0"/>
    <text x="870" y="157" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" fill="#5e5a6e">claude — zsh</text>

    <!-- Terminal content -->
    <text x="648" y="205" font-family="'SF Mono','Fira Code',monospace" font-size="13" fill="#d98f40">$</text>
    <text x="665" y="205" font-family="'SF Mono','Fira Code',monospace" font-size="13" fill="#e8e6e3">claude</text>

    <text x="660" y="235" font-family="'SF Mono','Fira Code',monospace" font-size="12" fill="#9a96a6">Welcome to Claude Code! (Opus 4.6)</text>

    <text x="648" y="270" font-family="'SF Mono','Fira Code',monospace" font-size="13" fill="#d98f40">&gt;</text>
    <text x="665" y="270" font-family="'Noto Sans JP','SF Mono',monospace" font-size="13" fill="#e8e6e3">バグを修正して、テストも書いて</text>

    <text x="660" y="302" font-family="'SF Mono','Fira Code',monospace" font-size="12" fill="#4ec9a0">&#10003; Bug fixed in src/auth.ts:42</text>
    <text x="660" y="326" font-family="'SF Mono','Fira Code',monospace" font-size="12" fill="#4ec9a0">&#10003; Test added: auth.test.ts</text>
    <text x="660" y="350" font-family="'SF Mono','Fira Code',monospace" font-size="12" fill="#4ec9a0">&#10003; All tests passing</text>

    <text x="648" y="385" font-family="'SF Mono','Fira Code',monospace" font-size="13" fill="#d98f40">&gt;</text>
    <text x="665" y="385" font-family="'Noto Sans JP','SF Mono',monospace" font-size="13" fill="#e8e6e3">この変更をコミットして</text>

    <text x="660" y="417" font-family="'SF Mono','Fira Code',monospace" font-size="12" fill="#4ec9a0">&#10003; Committed: "fix: auth token validation"</text>

    <text x="648" y="455" font-family="'SF Mono','Fira Code',monospace" font-size="13" fill="#d98f40">&gt;</text>
    <rect x="662" y="442" width="9" height="17" fill="#d98f40" opacity="0.8"/>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="624" width="1200" height="6" fill="url(#titleGrad)" opacity="0.6"/>

  <!-- Footer text -->
  <text x="80" y="560" font-family="'SF Mono',monospace" font-size="12" fill="#5e5a6e">Powered by Claude Opus 4.6</text>
  <text x="80" y="580" font-family="-apple-system,'Noto Sans JP',sans-serif" font-size="12" fill="#5e5a6e">あなたの開発を加速させる</text>
</svg>
